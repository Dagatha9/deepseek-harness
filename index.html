ree":true},{"id":"pcv2rota2","date":"2026-09-27","age":"3,5 tháng","vaccine":"Prevenar 20 mũi 2/3 + Rotarix liều 2/2 (uống)","level":"bb","route":"oral","status":"pending","note":"Rotarix: sớm nhất 12/09, HẠN CHÓT cứng 26/11/2026","deadline":"2026-11-26","station":"Rota: hỏi trạm, một số tỉnh đã có miễn phí"},{"id":"hexa3","date":"2026-10-13","age":"4 tháng","vaccine":"Infanrix Hexa mũi 3/3","level":"bb","status":"pending","note":"Cách mũi 2 ≥ 4 tuần","station":"Có thay thế: 5 trong 1 + bại liệt miễn phí","free":true},{"id":"pcv3","date":"2026-10-25","age":"4,5 tháng","vaccine":"Prevenar 20 mũi 3/3","level":"bb","status":"pending","note":"Cách mũi 2 ≥ 4 tuần"},{"id":"bex1","date":"2026-11-08","age":"5 tháng","vaccine":"Bexsero (não mô cầu B) mũi 1/2","level":"tc","status":"pending","note":"Nên tiêm ngày riêng vì dễ sốt"},{"id":"flu1","date":"2026-12-12","age":"6 tháng","vaccine":"Cúm mũi 1/2 (Vaxigrip Tetra / Influvac Tetra)","level":"kc","status":"pending","note":"Được tiêm từ tròn 6 tháng (11/12/2026)"},{"id":"bex2flu2","date":"2027-01-09","age":"7 tháng","vaccine":"Bexsero mũi 2/2 + Cúm mũi 2/2","level":"tc","status":"pending","note":"Có thể tách 2 ngày nếu muốn"},{"id":"soi9","date":"2027-03-11","age":"9 tháng","vaccine":"Sởi đơn (MVVac) + Viêm não Nhật Bản (Imojev) mũi 1","level":"bb","status":"pending","note":"Kèm xét nghiệm HBsAg + anti-HBs kiểm tra viêm gan B","station":"Sởi miễn phí tại trạm; VNJB: trạm có Jevax từ 12 tháng","free":true},{"id":"men1","date":"2027-03-25","age":"9,5 tháng","vaccine":"Menactra (não mô cầu ACYW) mũi 1/2","level":"kc","status":"pending","note":"9–23 tháng: 2 mũi cách 3 tháng"},{"id":"mmr1pcv4","date":"2027-06-11","age":"12 tháng","vaccine":"Sởi–Quai bị–Rubella (MMR II) + Prevenar 20 mũi nhắc","level":"bb","status":"pending","note":"Nhắc phế cầu 11–15 tháng","station":"Trạm có Sởi–Rubella (không quai bị) lúc 18 tháng"},{"id":"var1hepa1men2","date":"2027-06-25","age":"12,5 tháng","vaccine":"Thủy đậu (Varivax) mũi 1 + Viêm gan A (Havrix 720) mũi 1 + Menactra mũi 2","level":"kc","status":"pending","note":""},{"id":"bex3","date":"2027-07-10","age":"13 tháng","vaccine":"Bexsero mũi nhắc","level":"tc","status":"pending","note":"Cách mũi 2 ≥ 6 tháng"},{"id":"var2","date":"2027-09-25","age":"15,5 tháng","vaccine":"Thủy đậu mũi 2","level":"kc","status":"pending","note":"Cách mũi 1 ≥ 3 tháng"},{"id":"hexa4","date":"2027-11-11","age":"17 tháng","vaccine":"Infanrix Hexa mũi nhắc (mũi 4)","level":"bb","status":"pending","note":"Khoảng 16–18 tháng","station":"Có thay thế: DPT miễn phí lúc 18 tháng","free":true},{"id":"hepa2","date":"2027-12-25","age":"18,5 tháng","vaccine":"Viêm gan A mũi 2","level":"kc","status":"pending","note":"Cách mũi 1 từ 6–12 tháng"},{"id":"je2","date":"2028-03-01","age":"21 tháng","vaccine":"Viêm não Nhật Bản (Imojev) mũi 2","level":"bb","status":"pending","approx":true,"display":"Tháng 03/2028","note":"Cách mũi 1 từ 12–24 tháng","station":"Trạm có Jevax (3 mũi) miễn phí","free":true},{"id":"mmr2","date":"2030-06-01","age":"4 tuổi","vaccine":"MMR mũi 2 + nhắc Bạch hầu–Ho gà–Uốn ván–Bại liệt (Tetraxim)","level":"bb","status":"pending","approx":true,"display":"Tháng 06/2030","note":"Khoảng 4–6 tuổi","station":"Một phần: Sởi–Rubella, DPT nhắc theo chiến dịch"}],"history":[{"ts":1788141600000,"action":"init","doseId":null,"label":"","detail":"Khởi tạo sổ điện tử từ file Word 30/08/2026 — đã ghi nhận 5 mũi đã tiêm (VGB sơ sinh + HBIG, BCG, Rotarix 1, Infanrix Hexa 1, Prevenar 20 mũi 1) và 17 mốc lịch tiêm tiếp theo (Phương án A)."}],"guide":{"vaccines":[{"name":"Infanrix Hexa (6 trong 1 — Bỉ)","prevents":"Bạch hầu, ho gà, uốn ván, bại liệt, viêm gan B, viêm phổi – viêm màng não do Hib.","schedule":"3 mũi cơ bản lúc 2–3–4 tháng (cách nhau ≥ 4 tuần), mũi nhắc lúc 16–18 tháng.","reactions":"Sốt nhẹ 38–38,5°C trong 1–2 ngày, sưng đỏ đau chỗ tiêm, quấy khóc, ăn kém. Ít gặp: sốt ≥ 39°C, quấy khóc kéo dài.","notes":"Vắc-xin quan trọng nhất năm đầu, không trì hoãn quá 1–2 tuần. Hoãn nếu bé sốt ≥ 38°C hoặc bệnh cấp tính. Tiền sử co giật do sốt cần báo bác sĩ."},{"name":"Rotarix (Rotavirus — uống)","prevents":"Tiêu chảy cấp do virus Rota — nguyên nhân hàng đầu gây tiêu chảy mất nước nặng ở trẻ dưới 2 tuổi.","schedule":"2 liều uống cách ≥ 4 tuần. Với Vũ: phải xong TRƯỚC 26/11/2026 — quá tuổi sẽ không được uống nữa.","reactions":"Quấy khóc nhẹ, tiêu chảy hoặc nôn nhẹ, chán ăn 1–2 ngày. Hiếm: lồng ruột (chủ yếu trong 7 ngày sau liều 1).","notes":"Không cho bú 30 phút trước khi uống. Theo dõi dấu hiệu lồng ruột: khóc thét từng cơn, nôn nhiều, bụng chướng, phân máu → đi viện ngay. Rửa tay kỹ khi thay tã 1–2 tuần sau uống."},{"name":"Prevenar 20 (Phế cầu — Pfizer)","prevents":"Viêm phổi, viêm màng não, nhiễm trùng huyết, viêm tai giữa do 20 chủng phế cầu.","schedule":"3 mũi cơ bản cách ≥ 4 tuần (2–4–6 tháng), mũi nhắc lúc 11–15 tháng.","reactions":"Sưng đau chỗ tiêm, sốt nhẹ, cáu gắt, ăn kém, ngủ nhiều; hết trong 1–2 ngày.","notes":"Tiêm được cùng ngày với 6 trong 1 và Rotarix. Nên giữ nguyên một loại phế cầu cho đủ loạt."},{"name":"Bexsero (Não mô cầu B — Ý)","optional":true,"prevents":"Viêm màng não, nhiễm trùng huyết do não mô cầu nhóm B — hiếm nhưng diễn tiến rất nhanh.","schedule":"Bắt đầu 2–5 tháng: 2 mũi cách 2 tháng + 1 mũi nhắc lúc 12–15 tháng (cách mũi 2 ≥ 6 tháng).","reactions":"Gây sốt nhiều hơn vắc-xin khác (≥ 38,5°C khá thường gặp trong 6 giờ đầu), đau sưng chỗ tiêm, quấy khóc.","notes":"Nên tiêm ngày riêng để dễ theo dõi. Hỏi bác sĩ về paracetamol dự phòng. Giá cao — cân nhắc theo điều kiện."},{"name":"Cúm mùa (Vaxigrip Tetra / Influvac Tetra)","prevents":"Cúm A và B — giảm nguy cơ viêm phổi, nhập viện; đặc biệt cần khi bé đi nhà trẻ.","schedule":"Từ tròn 6 tháng: năm đầu 2 mũi cách ≥ 4 tuần, sau đó mỗi năm 1 mũi (tốt nhất tháng 9–11).","reactions":"Sốt nhẹ, đau chỗ tiêm, mệt, ăn kém 1–2 ngày.","notes":"Dị ứng trứng nặng cần báo bác sĩ. Bố mẹ, ông bà cũng nên tiêm cúm hằng năm để bảo vệ gián tiếp cho bé."},{"name":"Sởi đơn (MVVac — Việt Nam)","prevents":"Bệnh sởi — gây viêm phổi, viêm não, suy dinh dưỡng; dịch vẫn xảy ra định kỳ.","schedule":"1 mũi lúc 9 tháng; sau đó MMR lúc 12 tháng và MMR mũi 2 lúc 4–6 tuổi.","reactions":"Sốt nhẹ, phát ban nhẹ xuất hiện muộn (ngày 5–12), kéo dài 1–3 ngày — bình thường.","notes":"Vắc-xin sống: hoãn nếu đang corticoid liều cao, suy giảm miễn dịch, mới truyền máu/globulin trong 3 tháng. Miễn phí tại trạm y tế xã."},{"name":"Imojev (Viêm não Nhật Bản — Thái Lan)","prevents":"Viêm não Nhật Bản — do muỗi truyền, tử vong và di chứng thần kinh cao; Nghệ An là vùng lưu hành.","schedule":"Mũi 1 từ 9 tháng, mũi 2 cách 12–24 tháng. (Jevax của VN: từ 12 tháng, 3 mũi + nhắc mỗi 3 năm.)","reactions":"Sốt nhẹ, đau chỗ tiêm, quấy khóc, đôi khi phát ban nhẹ.","notes":"Vắc-xin sống, chỉ 2 mũi là đủ bảo vệ lâu dài. Hoãn nếu suy giảm miễn dịch."},{"name":"Menactra (Não mô cầu ACYW — Mỹ)","prevents":"Viêm màng não, nhiễm trùng huyết do não mô cầu nhóm A, C, Y, W (khác nhóm B).","schedule":"Từ 9 tháng: 2 mũi cách 3 tháng nếu bắt đầu 9–23 tháng; từ 2 tuổi chỉ cần 1 mũi.","reactions":"Đau sưng chỗ tiêm, sốt nhẹ, cáu gắt, chán ăn.","notes":"Tiêm được cùng ngày với sởi / viêm não Nhật Bản. Muốn tiết kiệm: chờ 2 tuổi tiêm 1 mũi duy nhất."},{"name":"MMR II (Sởi–Quai bị–Rubella — Mỹ)","prevents":"Sởi, quai bị (viêm tinh hoàn, viêm màng não), rubella.","schedule":"Mũi 1 lúc 12 tháng (cách sởi đơn ≥ 4 tuần), mũi 2 lúc 4–6 tuổi.","reactions":"Sốt, phát ban nhẹ muộn (ngày 5–12), sưng hạch hoặc tuyến mang tai nhẹ. Hiếm: co giật do sốt.","notes":"Vắc-xin sống. Nếu không tiêm cùng ngày với thủy đậu thì phải cách ≥ 4 tuần."},{"name":"Varivax (Thủy đậu — Mỹ)","prevents":"Thủy đậu — nhiễm trùng da, viêm phổi, viêm não; để lại sẹo.","schedule":"Mũi 1 từ 12 tháng, mũi 2 cách ≥ 3 tháng (hoặc lúc 4–6 tuổi).","reactions":"Đau chỗ tiêm, sốt nhẹ, có thể nổi vài nốt phỏng nhỏ sau 1–3 tuần.","notes":"Vắc-xin sống. Tiêm cùng ngày MMR được, nếu không thì cách ≥ 4 tuần. Tránh aspirin 6 tuần sau tiêm."},{"name":"Havrix 720 / Avaxim 80 (Viêm gan A)","prevents":"Viêm gan siêu vi A — lây qua thức ăn, nước uống.","schedule":"Từ 12 tháng: 2 mũi cách nhau 6–12 tháng.","reactions":"Đau nhẹ chỗ tiêm, sốt nhẹ, mệt mỏi.","notes":"Vắc-xin bất hoạt, an toàn, tiêm cùng vắc-xin khác được. Vũ đã đủ viêm gan B nên chỉ cần loại đơn."}],"care":[{"title":"Trước khi tiêm","items":["Bé phải khỏe: không sốt, không ho nhiều, không tiêu chảy, không đang dùng kháng sinh vì bệnh cấp tính. Nghi ngờ thì cứ đến để bác sĩ khám sàng lọc.","Mang theo sổ tiêm chủng và giấy tờ của bé. Cho bú/ăn trước tiêm ~30 phút — không để bé đói; riêng Rotarix không cho bú ngay trước khi uống.","Mặc quần áo rộng, dễ cởi tay/đùi. Báo bác sĩ phản ứng bất thường lần trước và tiền sử dị ứng gia đình."]},{"title":"Sau khi tiêm","items":["Ở lại điểm tiêm 30 phút (phản vệ nếu có thường xảy ra trong thời gian này).","Theo dõi tại nhà 24–48 giờ: nhiệt độ, chỗ tiêm, ăn bú, giấc ngủ. Không đắp lá, khoai tây hay bất cứ thứ gì lên chỗ tiêm.","Sốt dưới 38,5°C: nới quần áo, lau ấm, bú nhiều hơn. Từ 38,5°C: paracetamol 10–15 mg/kg/lần (bé 6,5 kg ≈ 65–100 mg), cách 4–6 giờ, tối đa 4 lần/ngày — theo chỉ định bác sĩ. Không aspirin; không ibuprofen cho bé dưới 6 tháng.","Sưng đỏ chỗ tiêm: chườm mát 24 giờ đầu, tự hết sau 2–3 ngày. Vết cứng nhỏ có thể tồn tại vài tuần."]},{"title":"Dấu hiệu cần đi viện NGAY","items":["Sốt ≥ 39°C không hạ sau khi dùng thuốc, hoặc sốt kéo dài quá 48 giờ.","Co giật, li bì khó đánh thức, bỏ bú hoàn toàn, khóc thét dai dẳng trên 3 giờ.","Khó thở, thở rít, tím tái, nổi mề đay toàn thân, sưng mặt/môi — có thể là phản vệ.","Chỗ tiêm sưng đỏ lan trên 5 cm, chảy mủ, hoặc bé không cử động được chân/tay bên tiêm.","Sau uống Rotarix: nôn nhiều, khóc từng cơn dữ dội, bụng chướng, đi ngoài ra máu (nghi lồng ruột)."]},{"title":"Nguyên tắc về khoảng cách","items":["Vắc-xin bất hoạt (6 trong 1, phế cầu, cúm, viêm gan A, não mô cầu) tiêm cùng ngày hoặc bất kỳ ngày nào với nhau đều được.","Hai vắc-xin sống dạng tiêm (sởi, MMR, thủy đậu, Imojev) phải tiêm cùng ngày, nếu không thì cách nhau ≥ 4 tuần.","Tiêm muộn không cần tiêm lại từ đầu — chỉ tiếp tục mũi còn thiếu. Tiêm sớm hơn khoảng cách tối thiểu thì mũi đó không được tính."]},{"title":"Mũi nào miễn phí tại trạm y tế xã (TCMR)?","items":["5 trong 1 (SII) lúc 2–3–4 tháng + bại liệt uống (bOPV) + bại liệt tiêm (IPV) lúc 5 và 9 tháng — phương án thay cho 6 trong 1 dịch vụ.","Sởi đơn lúc 9 tháng; Sởi–Rubella lúc 18 tháng; DPT nhắc lúc 18 tháng; Jevax (viêm não Nhật Bản) từ 12 tháng.","Rotavirus đang vào TCMR theo lộ trình từng tỉnh — hỏi trạm; nếu có, liều 2 của Vũ có thể uống miễn phí (cùng loại Rotarix).","KHÔNG có ở trạm: 6 trong 1, phế cầu, cúm, não mô cầu B/ACYW, thủy đậu, quai bị, viêm gan A.","Với Vũ, tiết kiệm mà an toàn: giữ 6 trong 1 + phế cầu dịch vụ cho đủ loạt; sởi 9 tháng, Jevax, Sởi–Rubella và DPT 18 tháng tiêm tại trạm."]}],"costs":[{"name":"Infanrix Hexa","doses":"3 mũi","total":"≈ 3.000.000 đ"},{"name":"Prevenar 20","doses":"3 mũi","total":"≈ 6.000.000 đ"},{"name":"Rotarix","doses":"1 liều","total":"≈ 800.000 đ"},{"name":"Cúm","doses":"2 mũi","total":"≈ 700.000 đ"},{"name":"Sởi đơn MVVac","doses":"1 mũi","total":"0 – 100.000 đ (miễn phí tại trạm)"},{"name":"Imojev","doses":"2 mũi","total":"≈ 1.600.000 đ"},{"name":"Menactra","doses":"2 mũi","total":"≈ 2.200.000 đ"},{"name":"MMR II","doses":"1 mũi","total":"≈ 300.000 đ"},{"name":"Varivax","doses":"2 mũi","total":"≈ 2.000.000 đ"},{"name":"Viêm gan A","doses":"2 mũi","total":"≈ 1.000.000 đ"},{"name":"Bexsero (tùy chọn)","doses":"3 mũi","total":"≈ 5.400.000 đ"}],"costNote":"Tổng dự kiến đến 2 tuổi: khoảng 17–18 triệu đồng (chưa gồm Bexsero); thêm Bexsero khoảng 23 triệu. Hỏi \"gói tiêm năm đầu / 2 năm đầu\" thường rẻ hơn 5–10% và được giữ giá.","disclaimer":"Sổ này mang tính tham khảo, tổng hợp theo hướng dẫn chung; quyết định tiêm cuối cùng do bác sĩ khám sàng lọc tại điểm tiêm đưa ra."}}</script><script id="app-main">

const CSS = `

`;

/* ---------- state ---------- */

const stateEl = document.getElementById("app-state");
let state;
try { state = JSON.parse(stateEl.textContent); }
catch (e) { /* JSON hỏng chỉ xảy ra nếu một publish thủ công làm hỏng khối state; dựng lại từ bản rỗng để trang vẫn mở được */ state = null; }
if (!state || !Array.isArray(state.doses)) state = { baby:{name:"Đặng Anh Vũ",dob:"2026-06-11"}, doses:[], history:[], rev:0 };

const LS_KEY = "so-tiem-anh-vu";
let storageMode = "pending"; // pending | artifact | local | readonly
let artifactNS = null;
let activeTab = "schedule";
let activeFilter = "all";
try { const t = sessionStorage.getItem("vx-tab"); if (t) { activeTab = t; sessionStorage.removeItem("vx-tab"); } } catch (e) { /* sessionStorage bị chặn (chụp thumbnail, private mode); tab mặc định là đủ */ }

const LEVEL = { bb:{cls:"bb",label:"Bắt buộc"}, kc:{cls:"kc",label:"Khuyến cáo"}, tc:{cls:"tc",label:"Tùy chọn"} };

/* ---------- helpers ---------- */

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function safeJson(o){ return JSON.stringify(o).replace(/</g,"\\u003c"); }
function pad(n){ return String(n).padStart(2,"0"); }
function fmtDate(iso){ const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }
function fmtTs(ts){ const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function todayIso(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function daysFromToday(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const a = new Date(); a.setHours(0,0,0,0);
  return Math.round((new Date(y,m-1,d) - a) / 864e5);
}
function ageNow(dobIso){
  const [y,m,d] = dobIso.split("-").map(Number);
  const dob = new Date(y,m-1,d), now = new Date();
  let months = (now.getFullYear()-dob.getFullYear())*12 + (now.getMonth()-dob.getMonth());
  let anchor = new Date(dob); anchor.setMonth(dob.getMonth()+months);
  if (anchor > now) { months--; anchor = new Date(dob); anchor.setMonth(dob.getMonth()+months); }
  const days = Math.round((now - anchor)/864e5);
  if (months < 1) return `${days} ngày tuổi`;
  if (months < 24) return `${months} tháng ${days} ngày`;
  return `${Math.floor(months/12)} tuổi ${months%12} tháng`;
}

/* ---------- document rebuild (nguồn chuẩn của trang, không serialize DOM) ---------- */

function buildDoc(st){
  return "<!doctype html>\n<html lang=\"vi\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Sổ tiêm chủng Anh Vũ</title>" +
    FONT_LINKS +
    "</head><body><div id=\"app\"></div>" +
    "<script id=\"app-state\" type=\"application/json\">" + safeJson(st) + "<\/script>" +
    "<script id=\"app-main\">" + SCRIPT_SRC + "<\/script>" +
    "</body></html>";
}

/* ---------- persistence ---------- */

let saveTimer = null;
function setSaveMsg(cls, msg){
  const el = document.getElementById("savebar");
  if (!el) return;
  el.className = "savebar " + cls;
  el.innerHTML = msg ? '<span class="dot"></span>' + esc(msg) : "";
  if (saveTimer) clearTimeout(saveTimer);
  if (cls === "ok") saveTimer = setTimeout(() => { el.innerHTML = ""; }, 4000);
}

async function resolveArtifact(){
  if (!(window.claude && typeof window.claude.use === "function")) return null;
  try { return await window.claude.use("artifact"); }
  catch (e) { return null; }
}

const nsReady = resolveArtifact().then(ns => {
  artifactNS = ns;
  if (ns) { storageMode = "artifact"; }
  else {
    storageMode = "local";
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved && typeof saved.rev === "number" && saved.rev > (state.rev || 0)) { state = saved; }
      }
    } catch (e) { /* localStorage bị chặn hoặc dữ liệu hỏng; dùng state nhúng trong trang */ }
    render();
  }
  renderBanner();
});

async function persist(){
  if (storageMode === "pending") await nsReady;
  if (storageMode === "readonly") return;
  if (storageMode === "local" || !artifactNS) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); setSaveMsg("ok","Đã lưu trên máy này"); }
    catch (e) { setSaveMsg("err","Không lưu được trên máy này"); }
    return;
  }
  setSaveMsg("", "Đang lưu…");
  try { sessionStorage.setItem("vx-tab", activeTab); } catch (e) { /* mất ghi nhớ tab sau reload là chấp nhận được */ }
  try {
    await artifactNS.publish(buildDoc(state));
    setSaveMsg("ok","Đã lưu"); // trang sẽ tự reload sang phiên bản mới
  } catch (err) {
    const code = err && err.code;
    if (code === "conflict") { setSaveMsg("", "Có thay đổi mới hơn, đang tải lại…"); return; }
    if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared") {
      storageMode = "readonly"; renderBanner(); render();
      setSaveMsg("err","Chế độ chỉ xem — thay đổi không được lưu");
      return;
    }
    if (code === "rate_limited") { setSaveMsg("err","Lưu quá nhanh, đợi một lát rồi thử lại"); return; }
    if (code === "upstream_error") {
      await new Promise(r => setTimeout(r, 800 + Math.random()*700));
      try { await artifactNS.publish(buildDoc(state)); setSaveMsg("ok","Đã lưu"); return; }
      catch (e2) { /* lần thử lại duy nhất cũng hỏng; rơi xuống thông báo lỗi chung */ }
    }
    setSaveMsg("err","Chưa lưu được — kiểm tra mạng rồi thao tác lại");
  }
}

/* ---------- mutations ---------- */

function logHistory(action, dose, detail){
  state.history.push({ ts: Date.now(), action, doseId: dose ? dose.id : null, label: dose ? dose.vaccine : "", detail: detail || "" });
}

function markDone(id, dateIso, note){
  const d = state.doses.find(x => x.id === id);
  if (!d || d.status === "done") return;
  d.status = "done"; d.doneDate = dateIso; d.doneNote = note || "";
  state.rev = (state.rev || 0) + 1;
  logHistory("check", d, "Đánh dấu đã tiêm ngày " + fmtDate(dateIso) + (note ? " — " + note : ""));
  render(); persist();
}

function markUndone(id, reason){
  const d = state.doses.find(x => x.id === id);
  if (!d || d.status !== "done") return;
  d.status = "pending"; const was = d.doneDate; d.doneDate = null; d.doneNote = "";
  state.rev = (state.rev || 0) + 1;
  logHistory("uncheck", d, "Bỏ đánh dấu (trước đó ghi tiêm ngày " + (was ? fmtDate(was) : "?") + ")" + (reason ? " — " + reason : ""));
  render(); persist();
}

/* ---------- icons ---------- */

const IC = {
  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/></svg>',
  shield: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/><path d="M8 7h7M8 11h7"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 13l4 4 9-10"/></svg>',
  car: '<svg class="car" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  hcheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 9-10"/></svg>',
  hx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  hstar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18" transform="scale(.7) translate(5 5)"/></svg>'
};

/* ---------- rendering ---------- */

function statusChips(d){
  const chips = [];
  if (d.status === "done") chips.push('<span class="chip done">Đã ' + (d.route === "oral" ? "uống" : "tiêm") + '</span>');
  else {
    const lv = LEVEL[d.level]; if (lv) chips.push(`<span class="chip ${lv.cls}">${lv.label}</span>`);
    if (!d.approx) {
      const n = daysFromToday(d.date);
      if (n < 0) chips.push(`<span class="chip due">Quá hẹn ${-n} ngày</span>`);
      else if (n === 0) chips.push('<span class="chip due">Hôm nay</span>');
      else if (n <= 30) chips.push(`<span class="chip soon">Còn ${n} ngày</span>`);
    }
    if (d.deadline) chips.push(`<span class="chip due">Hạn chót ${fmtDate(d.deadline)}</span>`);
  }
  if (d.free) chips.push('<span class="chip free">Trạm y tế: có/miễn phí</span>');
  return chips.join("");
}

function doseCard(d){
  const dis = storageMode === "readonly" ? " disabled" : "";
  return `<div class="card dose lv-${d.level}${d.status==="done" ? " is-done" : ""}">
    <div class="rail"></div>
    <div class="body">
      <div class="top"><span class="date">${d.approx ? esc(d.display) : fmtDate(d.date)}</span><span class="age">· ${esc(d.age)}</span></div>
      <div class="vx">${esc(d.vaccine)}</div>
      ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
      ${d.station ? `<div class="note">Trạm xã: ${esc(d.station)}</div>` : ""}
      <div class="chips">${statusChips(d)}</div>
      ${d.status==="done" && d.doneDate ? `<div class="done-when">✓ ${d.route==="oral"?"Đã uống":"Đã tiêm"} ngày ${fmtDate(d.doneDate)}</div>` : ""}
      ${d.doneNote ? `<div class="user-note">${esc(d.doneNote)}</div>` : ""}
    </div>
    <button class="tick" data-dose="${d.id}" aria-label="${d.status==="done" ? "Bỏ đánh dấu đã tiêm" : "Đánh dấu đã tiêm"}: ${esc(d.vaccine)}"${dis}>
      <span class="tickbox">${IC.check}</span>
    </button>
  </div>`;
}

function renderHeader(){
  return `<header class="hdr">
    <div class="eyebrow">Sổ tiêm chủng điện tử</div>
    <div class="hdr-row"><h1>${esc(state.baby.name)}</h1><span class="age-chip">${ageNow(state.baby.dob)}</span></div>
    <div id="savebar" class="savebar"></div>
  </header>
  <div id="banner-slot"></div>`;
}

function renderBanner(){
  const slot = document.getElementById("banner-slot");
  if (!slot) return;
  if (storageMode === "readonly") slot.innerHTML = '<div class="banner warn">Bạn đang xem bản chỉ đọc — thao tác tích tiêm sẽ không được lưu.</div>';
  else if (storageMode === "local") slot.innerHTML = '<div class="banner">Bản xem trước: thay đổi chỉ lưu trên thiết bị này. Mở qua link artifact trên claude.ai để lưu đồng bộ.</div>';
  else slot.innerHTML = "";
}

function tabSchedule(){
  const doses = state.doses;
  const done = doses.filter(d => d.status === "done").length;
  const bbAll = doses.filter(d => d.level === "bb");
  const bbDone = bbAll.filter(d => d.status === "done").length;
  const pending = doses.filter(d => d.status === "pending").slice().sort((a,b) => a.date < b.date ? -1 : 1);
  const next = pending[0];
  const pct = Math.round(done / doses.length * 100);

  let filtered = pending;
  if (activeFilter === "bb") filtered = pending.filter(d => d.level === "bb");
  if (activeFilter === "due") filtered = pending.filter(d => !d.approx && daysFromToday(d.date) <= 0);

  return `
  <div class="sec"><div class="card hero">
    <div class="who">
      <div class="avatar">V</div>
      <div><div class="nm">${esc(state.baby.name)}</div>
      <div class="meta">Sinh ${fmtDate(state.baby.dob)} · ${esc(state.baby.sex)} · ${esc(state.baby.growth)}</div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-lbl"><span>Tiến độ tiêm chủng</span><b>${done}/${doses.length} mũi (${pct}%)</b></div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="progress-lbl"><span>Mũi bắt buộc</span><b>${bbDone}/${bbAll.length}</b></div>
    </div>
    <div class="hb-note">⚕ ${esc(state.baby.specialNote)}</div>
  </div></div>
  ${next ? `<div class="sec"><div class="card next-card">
    <div class="lbl">Mũi tiếp theo</div>
    <div class="vx">${esc(next.vaccine)}</div>
    <div class="when">${next.approx ? esc(next.display) : `Ngày <b>${fmtDate(next.date)}</b>` + (daysFromToday(next.date) >= 0 ? ` — còn <b>${daysFromToday(next.date)}</b> ngày` : ` — <b>quá hẹn ${-daysFromToday(next.date)} ngày</b>`)}${next.note ? " · " + esc(next.note) : ""}</div>
  </div></div>` : `<div class="sec"><div class="card next-card"><div class="lbl">Hoàn thành</div><div class="vx">Đã tích hết các mũi trong lịch 🎉</div></div></div>`}
  <div class="filters">
    <button class="fbtn${activeFilter==="all"?" on":""}" data-filter="all">Tất cả (${pending.length})</button>
    <button class="fbtn${activeFilter==="bb"?" on":""}" data-filter="bb">Bắt buộc</button>
    <button class="fbtn${activeFilter==="due"?" on":""}" data-filter="due">Đến hẹn</button>
  </div>
  <div class="sec"><h2>Lịch tiêm sắp tới <span class="count">bấm ⚪ để tích đã tiêm</span></h2>
    <div class="stack">${filtered.length ? filtered.map(doseCard).join("") : '<div class="card empty">Không có mũi nào trong nhóm này.</div>'}</div>
  </div>`;
}

function tabDone(){
  const done = state.doses.filter(d => d.status === "done").slice().sort((a,b) => (a.doneDate||a.date) < (b.doneDate||b.date) ? -1 : 1);
  return `<div class="sec"><h2>Các mũi đã tiêm <span class="count">${done.length} mũi</span></h2>
    <div class="stack">${done.length ? done.map(doseCard).join("") : '<div class="card empty">Chưa tích mũi nào.</div>'}</div>
  </div>`;
}

function guideCard(v){
  return `<details class="acc"><summary>${esc(v.name)}${v.optional ? ' <span class="tag" style="background:var(--tc-soft);color:var(--tc)">tùy chọn</span>' : ""}${IC.car}</summary>
    <div class="inner">
      <p><span class="k">Phòng bệnh:</span> ${esc(v.prevents)}</p>
      <p><span class="k">Lịch tiêm:</span> ${esc(v.schedule)}</p>
      <p><span class="k">Phản ứng thường gặp:</span> ${esc(v.reactions)}</p>
      <p><span class="k">Lưu ý:</span> ${esc(v.notes)}</p>
    </div></details>`;
}

function tabGuide(){
  const g = state.guide;
  return `
  <div class="sec"><h2>Cẩm nang vắc-xin</h2><div class="stack">${g.vaccines.map(guideCard).join("")}</div></div>
  <div class="sec"><h2>Lưu ý cho mọi lần tiêm</h2><div class="stack">
    ${g.care.map(c => `<details class="acc"><summary>${esc(c.title)}${IC.car}</summary><div class="inner">${c.items.map(i => `<p>• ${esc(i)}</p>`).join("")}</div></details>`).join("")}
  </div></div>
  <div class="sec"><h2>Chi phí dự kiến <span class="count">tham khảo 2025–2026</span></h2>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Vắc-xin</th><th>Còn lại</th><th>Thành tiền</th></tr></thead>
    <tbody>${g.costs.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.doses)}</td><td>${esc(c.total)}</td></tr>`).join("")}</tbody></table></div>
    <p style="font-size:12.5px;color:var(--ink2);margin:8px 2px 0">${esc(g.costNote)}</p>
  </div>
  <div class="sec"><p style="font-size:12px;color:var(--ink2);margin:4px 2px 0">${esc(g.disclaimer)}</p></div>`;
}

function tabHistory(){
  const items = state.history.slice().sort((a,b) => b.ts - a.ts);
  return `<div class="sec"><h2>Lịch sử tương tác <span class="count">${items.length} sự kiện</span></h2>
    <div class="card hist">${items.length ? items.map(h => {
      const ic = h.action === "check" ? "check" : h.action === "uncheck" ? "uncheck" : "init";
      const svg = h.action === "check" ? IC.hcheck : h.action === "uncheck" ? IC.hx : IC.hstar;
      const title = h.action === "check" ? "Tích đã tiêm" : h.action === "uncheck" ? "Bỏ tích" : "Khởi tạo sổ";
      return `<div class="hist-item"><div class="hist-ic ${ic}">${svg}</div>
        <div class="hist-b"><div class="hist-t">${title}${h.label ? ": " + esc(h.label) : ""}</div>
        ${h.detail ? `<div class="hist-d">${esc(h.detail)}</div>` : ""}</div>
        <div class="hist-ts">${fmtTs(h.ts)}</div></div>`;
    }).join("") : '<div class="empty">Chưa có tương tác nào.</div>'}</div>
  </div>`;
}

const TABS = [
  { id:"schedule", label:"Lịch tiêm", icon:IC.cal, render:tabSchedule },
  { id:"done", label:"Đã tiêm", icon:IC.shield, render:tabDone },
  { id:"guide", label:"Cẩm nang", icon:IC.book, render:tabGuide },
  { id:"history", label:"Lịch sử", icon:IC.clock, render:tabHistory }
];

function render(){
  const tab = TABS.find(t => t.id === activeTab) || TABS[0];
  document.getElementById("app").innerHTML =
    renderHeader() +
    tab.render() +
    `<nav class="tabbar" aria-label="Điều hướng"><div class="in">
      ${TABS.map(t => `<button class="${t.id===activeTab?"on":""}" data-tab="${t.id}" aria-current="${t.id===activeTab ? "page" : "false"}">${t.icon}<span>${t.label}</span></button>`).join("")}
    </div></nav>`;
  renderBanner();
}

/* ---------- bottom sheet ---------- */

function openSheet(dose){
  const wasDone = dose.status === "done";
  const ovl = document.createElement("div");
  ovl.className = "ovl";
  ovl.innerHTML = wasDone
    ? `<div class="sheet" role="dialog" aria-modal="true">
        <h3>Bỏ đánh dấu mũi này?</h3>
        <p class="sub">${esc(dose.vaccine)} — đang ghi ${dose.route==="oral"?"đã uống":"đã tiêm"} ngày ${dose.doneDate ? fmtDate(dose.doneDate) : "?"}</p>
        <label for="sh-note">Lý do (không bắt buộc)</label>
        <textarea id="sh-note" placeholder="VD: tích nhầm, dời lịch…"></textarea>
        <div class="btns"><button class="btn-sec" data-act="cancel">Không</button><button class="btn-pri danger" data-act="undo">Bỏ đánh dấu</button></div>
      </div>`
    : `<div class="sheet" role="dialog" aria-modal="true">
        <h3>Xác nhận ${dose.route==="oral"?"đã uống":"đã tiêm"}</h3>
        <p class="sub">${esc(dose.vaccine)} · lịch hẹn ${dose.approx ? esc(dose.display) : fmtDate(dose.date)}</p>
        <label for="sh-date">Ngày ${dose.route==="oral"?"uống":"tiêm"} thực tế</label>
        <input id="sh-date" type="date" value="${todayIso()}">
        <label for="sh-note">Ghi chú (không bắt buộc)</label>
        <textarea id="sh-note" placeholder="VD: tiêm tại VNVC, bé sốt nhẹ buổi tối…"></textarea>
        <div class="btns"><button class="btn-sec" data-act="cancel">Hủy</button><button class="btn-pri" data-act="confirm">Xác nhận</button></div>
      </div>`;
  document.body.appendChild(ovl);
  ovl.addEventListener("click", (e) => {
    if (e.target === ovl) { ovl.remove(); return; }
    const act = e.target.closest("[data-act]");
    if (!act) return;
    const note = (ovl.querySelector("#sh-note") || {}).value || "";
    if (act.dataset.act === "confirm") {
      const dv = ovl.querySelector("#sh-date").value || todayIso();
      ovl.remove(); markDone(dose.id, dv, note.trim());
    } else if (act.dataset.act === "undo") {
      ovl.remove(); markUndone(dose.id, note.trim());
    } else ovl.remove();
  });
  const first = ovl.querySelector("input,textarea,button"); if (first) first.focus();
}

/* ---------- events ---------- */

document.getElementById("app").addEventListener("click", (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { activeTab = tabBtn.dataset.tab; render(); window.scrollTo(0,0); return; }
  const fBtn = e.target.closest("[data-filter]");
  if (fBtn) { activeFilter = fBtn.dataset.filter; render(); return; }
  const tick = e.target.closest("[data-dose]");
  if (tick && storageMode !== "readonly") {
    const d = state.doses.find(x => x.id === tick.dataset.dose);
    if (d) openSheet(d);
  }
});

/* ---------- boot ---------- */

(function boot(){
  const style = document.createElement("style");
  style.textContent = CSS;
  document.head.appendChild(style);
  if (!document.querySelector('link[href*="fonts.googleapis"]')) {
    const holder = document.createElement("div");
    holder.innerHTML = FONT_LINKS;
    Array.from(holder.children).forEach(el => document.head.appendChild(el));
  }
  render();
})();
</script></body></html>
